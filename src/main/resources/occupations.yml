# CoC第6版 基本ルールブック p.48「職業のサンプル」を基にした職業定義
#
# fixed-skills:
#   職業名が一致した時点で自動的に職業技能になる技能。
#
# restricted-choice:
#   count 個を skills の候補から選択する枠。
#
# free-choice-count:
#   「個人的あるいはその時代の特色的な技能」として自由に選択できる枠。
#
# 登録職業に一致しない職業名はオリジナル職業として扱い、
# config.yml の occupation.custom.max-selected-skills まで自由選択できます。

occupations:
  doctor:
    name: "医師"
    aliases: ["医者"]
    point-formula: "EDU*20"
    fixed-skills: [medicine, first_aid, credit_rating, psychology, psychoanalysis, biology, other_language, pharmacy]
    free-choice-count: 1

  engineer:
    name: "エンジニア"
    aliases: ["技師"]
    point-formula: "EDU*20"
    fixed-skills: [chemistry, mechanical_repair, operate_heavy_machinery, electrical_repair, geology, library_use, physics]
    free-choice-count: 1

  entertainer:
    name: "エンターテイナー"
    aliases: ["芸能人"]
    point-formula: "EDU*20"
    fixed-skills: [fast_talk, dodge, listen, art, credit_rating, psychology, disguise]
    free-choice-count: 1

  professor:
    name: "教授"
    aliases: []
    point-formula: "EDU*20"
    fixed-skills: [credit_rating, psychology, persuade, library_use, bargain, other_language]
    restricted-choice:
      count: 2
      skills: [medicine, chemistry, archaeology, anthropology, biology, geology, electronics, astronomy, natural_history, physics, law, history]
    free-choice-count: 0

  fanatic:
    name: "狂信者"
    aliases: []
    point-formula: "EDU*20"
    fixed-skills: [conceal, hide, psychology, persuade, library_use]
    restricted-choice:
      count: 2
      skills: [chemistry, electrical_repair, law, pharmacy, rifle]
    free-choice-count: 1

  military_officer:
    name: "軍士官"
    aliases: ["士官"]
    point-formula: "EDU*20"
    fixed-skills: [accounting, credit_rating, psychology, persuade, navigate, bargain, law]
    free-choice-count: 1

  police_officer:
    name: "警官"
    aliases: ["警察官"]
    point-formula: "EDU*20"
    fixed-skills: [fast_talk, first_aid, dodge, grapple, psychology, law]
    restricted-choice:
