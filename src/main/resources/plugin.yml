name: TRPGCharacter
version: 1.0.0
main: Rin.TRPGCharacter.Plugin
api-version: '1.20'
author: Rin
description: CoC 6th character sheet and dice plugin for Paper 1.20.1
softdepend: [ModelEngine]

commands:
  status:
    description: 探索者シートを開きます
    usage: /status [give|random-confirm|random|revive <player>|reload]
  roll:
    description: ダイスを振ります
    usage: /roll <XdY>
  trpgedit:
    description: キャラクターシート内部用コマンド
    usage: /trpgedit <stat|skill> <id>
  trpgroll:
    description: キャラクターシート内部用判定コマンド
    usage: /trpgroll <stat|skill|derived> <id>
  trpgcombo:
    description: 複合技能判定用の内部コマンド
    usage: /trpgcombo <combo>
  trpgattack:
    description: 探索者シートの素手攻撃方法を設定
    usage: /trpgattack <fist|kick>
  mythos:
    description: 神話生物NPCを管理します
    usage: /mythos <list|summon|sanreset|modelstatus> ...
  trpgskill:
    description: 技能ポイントを割り振ります
    usage: /trpgskill <hobby|hobby-reset|occupation|occupation-reset|shortcut|shortcut-reset> ...
  trpgoccupation:
    description: 職業を入力し、職業技能を設定します
    usage: /trpgoccupation <input|toggle> ...
  artifact:
    description: アーティファクトを管理します
    usage: /artifact <list|give|remove> ...
  kp:
    description: KP権限を付与します
    usage: /kp <player>

  kpbook:
    description: KPブックを開きます
    usage: /kpbook
  mctrpgtool:
    description: MCTRPG KP TOOLを受け取ります
    usage: /mctrpgtool
  session:
    description: TRPGセッションへの参加・退出・終了
    usage: /session <join|leave|list|time|end>
  create:
    description: TRPGセッションを作成します
    usage: /create session <セッション名> <時間帯>
  reset:
    description: 探索者情報を初期化します
    usage: /reset pc <player> | /reset players

  clue:
    description: シナリオ用情報ポイントを登録します
    usage: /clue <mark|hide|show|protect|unprotect|setup|sanreset> ...

  npc:
    description: リソースパック型NPCを管理します
    usage: /npc <create|delete|move|say|addline|clearlines|list|reload>

  lock:
    description: 鉄の扉にTRPG用の施錠状態を設定します
    usage: /lock <lock|hardlock|keygive|hammergive|wallmark|wallclear|wallinfo|keyinfo|unlock|clear> ...

  cultist:
    description: 祭壇の狂信者を管理します
    usage: /cultist <setupaltar|spawn|alert|calm|clear|status|reload> ...

permissions:
  trpg.admin:
    description: TRPGCharacterの管理コマンドを使用できます
    default: op

  trpg.keeper:
    description: KP機能
    default: false
