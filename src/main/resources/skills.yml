# ============================================================
# 共通クリティカル / ファンブル効果エンジン
# ============================================================
# すべての技能判定は自動的にこのエンジンを通ります。
# 将来 skills: に新しい技能を追加しても Java 側の登録作業は不要です。
#
# 各技能には以下を任意追加できます:
#   critical:
#     enabled: true
#     inherit-defaults: true
#     effects: [ ... ]
#   fumble:
#     enabled: true
#     inherit-defaults: true
#     effects: [ ... ]
#
# 使用可能 type:
# message, damage, heal-hp, heal-san, lose-san, blindness, potion,
# knockback, command, clue-fumble, clue-discover, repeat-success-effect
#
# amount は 1 / 1d3 / 1d6+1 等に対応。
# command では {player} {skill} {skill_id} {result} を使用できます。
critical-fumble:
  defaults:
    critical:
      enabled: true
      effects:
      - type: message
        text: "&6★ {skill} クリティカル！ 通常より良い結果を得ました。"
    fumble:
      enabled: true
      effects:
      - type: message
        text: "&4☠ {skill} ファンブル！ 状況が悪化しました。"

