# TRPGCharacter 設定

book:
  title: "探索者シート"
  author: "TRPG System"

# 能力値がまだ設定されていないプレイヤーの初期値
default-stat-value: 0

# /roll と本からの判定結果を全体チャットに表示するか
broadcast-rolls: true

# 入力できる能力値・技能値の範囲
input:
  min: 0
  max: 999

messages:
  prefix: "&6[TRPG]&r "


# 画面右側の個別ステータス表示
sidebar:
  enabled: true
  server-name: "MCTRPG Sever"
  # 20tick = 1秒
  update-interval: 20


# Minecraft本体の体力・満腹度との同期
health-sync:
  # 能力値未設定時の即死防止用
  safe-hp: 4
  # trueで満腹度を常に最大固定
  disable-hunger: true


# HP/SAN低下時の危険演出
danger-effects:
  enabled: true

  # 20tick = 1秒
  # 40tickなら約2秒ごとに状態を確認
  check-interval: 40

  # 固定の3段階
  # 50%以下: 軽度
  # 25%以下: 中度
  # 10%以下: 重度


# 入室時の本人向け案内
join-guide:
  enabled: true


# 暗所に入った際の「目星」自動判定と暗視
dark-vision:
  enabled: true

  # この明るさ以下を暗所として扱う（Minecraftの明るさ 0～15）
  light-level-threshold: 4

  # 使用する技能ID
  skill: "spot_hidden"

  # 暗所判定の周期。20tick = 1秒
  check-interval: 10

  # 成功中に付与する暗視の残り時間。
  # 暗所にいる間は定期的に更新され、明所へ出ると数秒で自然解除。
  effect-refresh-ticks: 1200


# 水中に入った際の「水泳」自動判定
auto-swim:
  enabled: true

  # 使用する技能ID
  skill: "swim"

  # 水中判定の周期。20tick = 1秒
  check-interval: 10

  # 成功中に付与するイルカの好意の残り時間。
  # 水中にいる間は更新され、水から出ると自然解除される。
  effect-refresh-ticks: 1200

  # 0 = イルカの好意 I
  dolphins-grace-amplifier: 0



# MCTRPG Rebuild: 技能共通クールダウン
skill-system:
  # PC/NPC/敵で共有。10000ms = 10秒
  global-cooldown-ms: 10000

# リソースパック不要のダイス演出
dice-animation:
  enabled: true
  nearby-radius: 12.0

# 技能成長
# クリティカル/ファンブル時に自動で成長判定を行う。
# 成長判定: 1d100 > 現在技能値 で成功。
skill-growth:
  enabled: true
  trigger-critical: true
  trigger-fumble: true
  increase: "1d10"
  max-skill-value: 99

# 二段ジャンプ（跳躍）
double-jump:
  enabled: true
  skill: "jump"
  cooldown-ms: 700
  vertical-velocity: 0.68
  forward-velocity: 0.28
  special-multiplier: 1.12
  critical-multiplier: 1.25
  fumble-downward-velocity: 0.25

# 登攀（蜘蛛の壁登り風）
climb:
  enabled: true
  skill: "climb"
  wall-check-distance: 0.55
  vertical-velocity: 0.20
  wall-stick-velocity: 0.08
  success-duration-ms: 5000
  retry-cooldown-ms: 2500

# SAN 0で孤立した探索者への恐怖・死亡演出
san-zero-alone:
  enabled: true
  # 何tickごとに状態を確認するか。20tick = 1秒
  check-interval-ticks: 10
  # この距離以内に生存中の探索者仲間がいれば孤立扱いを解除
  ally-range: 12.0
  # SAN 0かつ孤立状態がこの秒数続くと即死
  death-delay-seconds: 15
  # 孤立中に悲鳴を鳴らす間隔
  scream-interval-seconds: 3
  # 本人だけに聞こえる悲鳴系サウンド
  scream-sound: "ENTITY_GHAST_SCREAM"
  scream-volume: 0.8
  scream-pitch: 0.55


# 職業システム
occupation:
  # 6版標準の職業技能ポイント式。登録職業側で個別に上書き可能。
  default-point-formula: "EDU*20"
  custom:
    # occupations.yml と一致しないオリジナル職業で選択できる職業技能数
    max-selected-skills: 8


# よく使う技能ショートカット
skill-shortcuts:
  max: 6

# TRPG HP被弾演出
damage-feedback:
  enabled: true

# 神話生物専用モデル表示
mythos-visuals:
  enabled: true

# Model Engine 4 optional bridge (Paper 1.20.1)
# ModelEngineが無い場合でもTRPGCharacterは通常動作し、深きものはItemDisplayへフォールバックします。
model-engine:
  enabled: true

# 鉄扉の鍵開け
door-lock:
  # 鍵開け失敗後、同じ探索者が同じ扉へ再挑戦できるまでの秒数。
  # 0 にすると再挑戦制限なし。
  retry-after-failure-seconds: 300
